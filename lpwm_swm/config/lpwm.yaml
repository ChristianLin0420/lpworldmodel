defaults:
  - _self_
  - launcher: local
  - data: piecewise

output_model_name: lpwm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
embed_dim: 192

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  history_size: 3
  num_preds: 1

model:
  _target_: model.LpWM
  history_size: ${wm.history_size}
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: module.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
    link_function_type: ${loss.rdmreg.kwargs.link_function_type}
  pred_proj:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
    link_function_type: ${loss.rdmreg.kwargs.link_function_type}

loss:
  rdmreg:
    weight: 10.0
    kwargs:
      p: 1.0
      mu: 0.0
      link_function_type: "ReLU"     # ReLU = sparse LpWM; Identity = dense LeWM control
      loss_func_type: "sliced_wasserstein"
      num_slices: 1024
      matching_mode: "b_t_d"
      target_dist_rms_norm: False    # default OFF; paper's sparse LpWM runs opt in (=true) to stabilize feature scale
  temporal_jaccard:
    enabled: False                   # requires link_function_type == "ReLU"; cube uses True (weight 0.1)
    weight: 1.0
    kwargs:
      eps: 1.0e-8
