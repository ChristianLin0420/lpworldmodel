defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

# Dataset-driven MPC eval on swm/OGBCube-v0 (sanity check): goals from a
# collected expert trajectory (start + goal_offset_steps). eval.py sets
# world.max_episode_steps = 2 * eval_budget at runtime.

world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???   # set by eval.py from 2 * eval.eval_budget
  env_type: single
  ob_type: states
  multiview: False
  width: 224
  height: 224
  visualize_info: False
  terminate_at_goal: True

seed: 42
policy: random  # checkpoint name (under $STABLEWM_HOME/checkpoints) or "random"

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5      # frameskip (must match training frameskip)
  history_len: 3       # context frames (= training history_size)

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: ogbench/cube_single_expert_heldout.h5
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: False
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat

output:
  filename: ogb_cube_results.txt
