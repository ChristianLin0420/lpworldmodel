<path d="M890,898 L890,560 L872,560" stroke="#546060" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#e0)" stroke-dasharray="6,4"/>
<text x="712" y="502" font-size="14" text-anchor="end" fill="#546060" font-weight="bold">nothing about TRAINING changes here</text>
<rect x="34" y="898" width="872" height="592" rx="10" fill="#DFE4E4" fill-opacity="0.45" stroke="#546060" stroke-width="2.0"/>
<text x="54" y="930" font-size="18" text-anchor="start" fill="#546060" font-weight="bold">module:  cost  =  || W (z<tspan font-size="12" dy="5.0">pred</tspan><tspan dy="-5.0"></tspan> − z<tspan font-size="12" dy="5.0">goal</tspan><tspan dy="-5.0"></tspan>) ||Σ      W = (C + εI)<tspan font-size="12" dy="5.0">-1/2</tspan><tspan dy="-5.0"></tspan></text>
<path d="M52,942 L888,942" stroke="#546060" stroke-width="1.2" stroke-opacity="0.5"/>
<rect x="60" y="950" width="400" height="254" rx="8" fill="#FFFFFF" stroke="#18483C" stroke-width="1.6"/>
<text x="260.0" y="976" font-size="17" text-anchor="middle" fill="#18483C" font-weight="bold">as built  –  every direction equal</text>
<text x="260.0" y="995" font-size="12" text-anchor="middle" fill="#6C786C">isotropic MSE, terminal step only</text>
<text x="258" y="1030" font-size="12.5" text-anchor="middle" fill="#14231C">the code's Frobenius mass</text>
<text x="258" y="1060" font-size="14" text-anchor="middle" fill="#18483C" font-weight="bold">sits in ~25 of 384 directions</text>
<text x="258" y="1104" font-size="12" text-anchor="middle" fill="#6C786C">so 359 directions the encoder never</text>
<text x="258" y="1126" font-size="12" text-anchor="middle" fill="#6C786C">produces are weighted just as heavily</text>
<text x="258" y="1170" font-size="12" text-anchor="middle" fill="#A83024" font-weight="bold">CEM ranks candidates with that metric</text>
<rect x="476" y="950" width="400" height="254" rx="8" fill="#FFFFFF" stroke="#546060" stroke-width="1.6"/>
<text x="676.0" y="976" font-size="17" text-anchor="middle" fill="#546060" font-weight="bold">whitened  –  per checkpoint, measured</text>
<text x="676.0" y="995" font-size="12" text-anchor="middle" fill="#6C786C">C from the checkpoint's own codes</text>
<text x="512" y="1030" font-size="12.5" text-anchor="start" fill="#14231C">no training, no rollout, no env</text>
<text x="846" y="1030" font-size="11.5" text-anchor="end" fill="#546060" font-weight="bold">~12 GPU-h</text>
<text x="512" y="1074" font-size="12.5" text-anchor="start" fill="#14231C">same-checkpoint, PAIRED</text>
<text x="846" y="1074" font-size="11.5" text-anchor="end" fill="#546060" font-weight="bold">82% of variance controlled</text>
<text x="512" y="1118" font-size="12.5" text-anchor="start" fill="#14231C">so its bar is</text>
<text x="846" y="1118" font-size="11.5" text-anchor="end" fill="#546060" font-weight="bold">+0.05, not +0.09</text>
<text x="676" y="1170" font-size="11.5" text-anchor="middle" fill="#546060">W = I reproduces the default exactly</text>
<rect x="60" y="1230" width="816" height="168" rx="8" fill="#FFFFFF" stroke="#A83024" stroke-width="1.6"/>
<text x="468.0" y="1256" font-size="17" text-anchor="middle" fill="#A83024" font-weight="bold">WHY THIS IS A GATE, NOT A PROPOSAL</text>
<text x="468.0" y="1275" font-size="12" text-anchor="middle" fill="#6C786C">it decides ~500 GPU-h of arms</text>
<text x="470" y="1300" font-size="13.5" text-anchor="middle" fill="#14231C">S2, ST4 and ST5 all assume the metric is the problem.</text>
<text x="470" y="1326" font-size="13.5" text-anchor="middle" fill="#14231C" font-weight="bold">12 GPU-h on already-trained checkpoints says whether it is.</text>
<text x="470" y="1360" font-size="12" text-anchor="middle" fill="#A83024" font-weight="bold">GATE: below +0.05, all three are withdrawn</text>
<rect x="60" y="1420" width="178" height="44" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="149.0" y="1437" font-size="12" text-anchor="middle" fill="#6C786C">status</text>
<text x="149.0" y="1456" font-size="16" text-anchor="middle" fill="#A83024" font-weight="bold">machinery built</text>
<rect x="246" y="1420" width="178.3" height="44" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="335.13599999999997" y="1437" font-size="12" text-anchor="middle" fill="#6C786C">not launched</text>
<text x="335.13599999999997" y="1456" font-size="16" text-anchor="middle" fill="#A83024" font-weight="bold">needs eval plumbing</text>
<rect x="432.3" y="1420" width="178" height="44" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="521.2719999999999" y="1437" font-size="12" text-anchor="middle" fill="#6C786C">cost of the gate</text>
<text x="521.2719999999999" y="1456" font-size="16" text-anchor="middle" fill="#14231C" font-weight="bold">~12 GPU-h</text>
<rect x="618.3" y="1420" width="178" height="44" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="707.2719999999999" y="1437" font-size="12" text-anchor="middle" fill="#6C786C">what it decides</text>
<text x="707.2719999999999" y="1456" font-size="16" text-anchor="middle" fill="#14231C" font-weight="bold">S2 , ST4 , ST5</text>
