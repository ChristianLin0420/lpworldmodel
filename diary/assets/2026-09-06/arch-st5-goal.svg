<path d="M890,898 L890,560 L872,560" stroke="#546060" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#e0)" stroke-dasharray="6,4"/>
<text x="712" y="502" font-size="14" text-anchor="end" fill="#546060" font-weight="bold">plan-time only ⇒ the control is FREE</text>
<rect x="34" y="898" width="872" height="592" rx="10" fill="#DFE4E4" fill-opacity="0.45" stroke="#546060" stroke-width="2.0"/>
<text x="54" y="930" font-size="18" text-anchor="start" fill="#546060" font-weight="bold">module:  cost  =  mean<tspan font-size="12" dy="5.0">h</tspan><tspan dy="-5.0"></tspan> || pool(z<tspan font-size="12" dy="5.0">h</tspan><tspan dy="-5.0"></tspan>)  −  pool(z<tspan font-size="12" dy="5.0">goal</tspan><tspan dy="-5.0"></tspan>) ||Σ</text>
<path d="M52,942 L888,942" stroke="#546060" stroke-width="1.2" stroke-opacity="0.5"/>
<rect x="60" y="950" width="400" height="254" rx="8" fill="#FFFFFF" stroke="#18483C" stroke-width="1.6"/>
<text x="260.0" y="976" font-size="17" text-anchor="middle" fill="#18483C" font-weight="bold">as built  –  one frame, one step</text>
<text x="260.0" y="995" font-size="12" text-anchor="middle" fill="#6C786C">terminal prediction, token by token</text>
<text x="258" y="1034" font-size="12.5" text-anchor="middle" fill="#14231C">the goal is ONE encoded frame</text>
<text x="258" y="1064" font-size="13.5" text-anchor="middle" fill="#18483C" font-weight="bold">and only z[:, -1] is scored</text>
<text x="258" y="1116" font-size="12" text-anchor="middle" fill="#6C786C">so a trajectory passing through</text>
<text x="258" y="1138" font-size="12" text-anchor="middle" fill="#6C786C">the goal and leaving scores the same</text>
<text x="258" y="1176" font-size="12" text-anchor="middle" fill="#A83024" font-weight="bold">as one that never approaches it</text>
<rect x="476" y="950" width="400" height="254" rx="8" fill="#FFFFFF" stroke="#546060" stroke-width="1.6"/>
<text x="676.0" y="976" font-size="17" text-anchor="middle" fill="#546060" font-weight="bold">pooled  –  space AND time</text>
<text x="676.0" y="995" font-size="12" text-anchor="middle" fill="#6C786C">reuses AGG_PATTERNS</text>
<text x="676" y="1034" font-size="12.5" text-anchor="middle" fill="#14231C">pool the goal's tokens</text>
<text x="676" y="1058" font-size="11.5" text-anchor="middle" fill="#6C786C">(space)</text>
<text x="676" y="1096" font-size="12.5" text-anchor="middle" fill="#14231C">score the TRAJECTORY across h</text>
<text x="676" y="1120" font-size="11.5" text-anchor="middle" fill="#6C786C">(time)</text>
<text x="676" y="1164" font-size="12.5" text-anchor="middle" fill="#546060" font-weight="bold">it changes what REACHING means</text>
<rect x="60" y="1230" width="816" height="168" rx="8" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.6"/>
<text x="468.0" y="1256" font-size="17" text-anchor="middle" fill="#C88A1E" font-weight="bold">VERIFIED UNTOUCHED</text>
<text x="468.0" y="1275" font-size="12" text-anchor="middle" fill="#6C786C">over 874 archived plan runs, objective.mode and objective.base have 0 occurrences</text>
<text x="470" y="1300" font-size="13.5" text-anchor="middle" fill="#14231C">the only objective override ever used in this campaign is the vote family,</text>
<text x="470" y="1326" font-size="13.5" text-anchor="middle" fill="#14231C" font-weight="bold">the goal has never once been varied</text>
<text x="470" y="1360" font-size="12" text-anchor="middle" fill="#6C786C">same-checkpoint contrast ⇒ bar is +0.05, control free</text>
<rect x="60" y="1420" width="178" height="44" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="149.0" y="1437" font-size="12" text-anchor="middle" fill="#6C786C">plan-time only</text>
<text x="149.0" y="1456" font-size="16" text-anchor="middle" fill="#A83024" font-weight="bold">no retraining</text>
<rect x="246" y="1420" width="188.1" height="44" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="340.032" y="1437" font-size="12" text-anchor="middle" fill="#6C786C">control</text>
<text x="340.032" y="1456" font-size="16" text-anchor="middle" fill="#A83024" font-weight="bold">free, same checkpoint</text>
<rect x="442.1" y="1420" width="178" height="44" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="531.064" y="1437" font-size="12" text-anchor="middle" fill="#6C786C">gated on</text>
<text x="531.064" y="1456" font-size="16" text-anchor="middle" fill="#14231C" font-weight="bold">M2 >= +0.05</text>
<rect x="628.1" y="1420" width="178" height="44" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="717.064" y="1437" font-size="12" text-anchor="middle" fill="#6C786C">cost if opened</text>
<text x="717.064" y="1456" font-size="16" text-anchor="middle" fill="#14231C" font-weight="bold">~60 GPU-h</text>
