  <marker id="e1" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9.1" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.6,1.6 L9.6,5 L0.6,8.4 z" fill="#A83024"/></marker>
  <marker id="e2" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9.1" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.6,1.6 L9.6,5 L0.6,8.4 z" fill="#546060"/></marker>
  <marker id="s3" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="0.9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M9.4,1.6 L0.4,5 L9.4,8.4 z" fill="#A83024"/></marker>
  <marker id="e4" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9.1" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.6,1.6 L9.6,5 L0.6,8.4 z" fill="#C88A1E"/></marker>
  <marker id="e5" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9.1" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0.6,1.6 L9.6,5 L0.6,8.4 z" fill="#543C84"/></marker>
</defs>
<rect width="940" height="800" fill="#FFFFFF"/>
<text x="470.0" y="46" font-size="20" text-anchor="middle" fill="#14231C" font-weight="bold">(P2)  PiWM-enc-ssm-deep –  the same state, carried between ViT blocks</text>
<text x="470.0" y="72" font-size="13" text-anchor="middle" fill="#6C786C">the direct test of the premise: early mixing WITH a single-frame limit</text>
<rect x="48" y="104" width="420" height="560" rx="8" fill="#FFFFFF" stroke="#18483C" stroke-width="1.6"/>
<text x="258.0" y="130" font-size="17" text-anchor="middle" fill="#18483C" font-weight="bold">THE STACK</text>
<text x="258.0" y="149" font-size="12" text-anchor="middle" fill="#6C786C">state inserted after every k-th block, not once at the end</text>
<rect x="148" y="168" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#18483C" stroke-width="1.8"/>
<text x="258.0" y="196.0" font-size="13.5" text-anchor="middle" fill="#14231C">patch embed</text>
<text x="384" y="195" font-size="10" text-anchor="start" fill="#6C786C">(b·T, 257, 384)</text>
<path d="M258,212 L258,234" stroke="#18483C" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e0)"/>
<rect x="148" y="234" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#18483C" stroke-width="1.8"/>
<text x="258.0" y="262.0" font-size="13.5" text-anchor="middle" fill="#14231C">ViT block  1..k</text>
<path d="M258,278 L258,300" stroke="#18483C" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e0)"/>
<rect x="148" y="300" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.8"/>
<text x="258.0" y="328.0" font-size="13.5" text-anchor="middle" fill="#14231C">state scan over T</text>
<text x="384" y="327" font-size="10" text-anchor="start" fill="#6C786C">the insertion</text>
<path d="M258,344 L258,366" stroke="#C88A1E" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e4)"/>
<rect x="148" y="366" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#18483C" stroke-width="1.8"/>
<text x="258.0" y="394.0" font-size="13.5" text-anchor="middle" fill="#14231C">ViT block  k+1..2k</text>
<path d="M258,410 L258,432" stroke="#18483C" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e0)"/>
<rect x="148" y="432" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.8"/>
<text x="258.0" y="460.0" font-size="13.5" text-anchor="middle" fill="#14231C">state scan over T</text>
<text x="384" y="459" font-size="10" text-anchor="start" fill="#6C786C">the insertion</text>
<path d="M258,476 L258,498" stroke="#C88A1E" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e4)"/>
<rect x="148" y="498" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#18483C" stroke-width="1.8"/>
<text x="258.0" y="526.0" font-size="13.5" text-anchor="middle" fill="#14231C">ViT block  ...12</text>
<path d="M258,542 L258,564" stroke="#18483C" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e0)"/>
<rect x="148" y="564" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#18483C" stroke-width="1.8"/>
<text x="258.0" y="592.0" font-size="13.5" text-anchor="middle" fill="#14231C">projector</text>
<text x="384" y="591" font-size="10" text-anchor="start" fill="#6C786C">(b·T, P, 384)</text>
<rect x="488" y="104" width="404" height="264" rx="8" fill="#FFFFFF" stroke="#A83024" stroke-width="1.6"/>
<text x="690.0" y="130" font-size="17" text-anchor="middle" fill="#A83024" font-weight="bold">WHY IT MUST SUBCLASS Block</text>
<text x="690.0" y="149" font-size="12" text-anchor="middle" fill="#6C786C">infojepa_modules.py:220 dispatches on isinstance</text>
<text x="524" y="176" font-size="12" text-anchor="start" fill="#6C786C">the Transformer loop is:</text>
<text x="536" y="204" font-size="11.5" text-anchor="start" fill="#14231C">if isinstance(block, Block):</text>
<text x="536" y="228" font-size="11.5" text-anchor="start" fill="#14231C">    x = block(x, attn_mask=attn_mask)</text>
<text x="536" y="252" font-size="11.5" text-anchor="start" fill="#A83024">else:</text>
<text x="536" y="276" font-size="11.5" text-anchor="start" fill="#A83024">    x = block(x, c, attn_mask=attn_mask)</text>
<text x="690" y="322" font-size="12" text-anchor="middle" fill="#A83024" font-weight="bold">a non-subclass is called with 3 args</text>
<text x="690" y="346" font-size="11.5" text-anchor="middle" fill="#6C786C">and crashes on arity</text>
<rect x="488" y="392" width="404" height="272" rx="8" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.6"/>
<text x="690.0" y="418" font-size="17" text-anchor="middle" fill="#C88A1E" font-weight="bold">WHAT IT TESTS</text>
<text x="690.0" y="437" font-size="12" text-anchor="middle" fill="#6C786C">blockcausal had early mixing and NO single-frame limit</text>
<text x="524" y="462" font-size="12.5" text-anchor="start" fill="#14231C">blockcausal mixed early ⇒ SR 0.00</text>
<text x="524" y="492" font-size="12.5" text-anchor="start" fill="#14231C">P2 mixes early WITH the limit</text>
<text x="524" y="552" font-size="12.5" text-anchor="start" fill="#C88A1E">if P2 works  ⇒  the premise is right</text>
<text x="524" y="582" font-size="12.5" text-anchor="start" fill="#C88A1E">if P2 is ~0  ⇒  early mixing is</text>
<text x="524" y="612" font-size="12.5" text-anchor="start" fill="#C88A1E">        harmful for another reason</text>
<rect x="48" y="690" width="844" height="70" rx="6" fill="#F7E8C8" stroke="#C88A1E" stroke-width="1.2" opacity="0.55"/>
<text x="470.0" y="723" font-size="15.5" text-anchor="middle" fill="#14231C" font-weight="bold">same recurrence as P1, applied to (b, T, L, D) at each insertion depth</text>
<text x="470.0" y="747" font-size="11.5" text-anchor="middle" fill="#6C786C">StateBlock(Block) folds (b, T·L, D) -> (b, T, L, D), scans T, folds back; T is num_hist, fixed per run</text>
</svg>
