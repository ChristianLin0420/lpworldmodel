<text x="642" y="356" font-size="12" text-anchor="middle" fill="#C88A1E" font-weight="bold">A</text>
<text x="470" y="434" font-size="12.5" text-anchor="middle" fill="#C88A1E" font-weight="bold">spatial within · temporal across  ⇒  one operator family on both axes</text>
<text x="470" y="464" font-size="11.5" text-anchor="middle" fill="#6C786C">a win is attributable because P1 and P3 isolate each half</text>
<rect x="48" y="530" width="844" height="70" rx="6" fill="#F7E8C8" stroke="#C88A1E" stroke-width="1.2" opacity="0.55"/>
<text x="184.9" y="563" font-size="15.5" text-anchor="start" fill="#14231C" font-weight="bold">within a frame:  s<tspan font-size="11" dy="4.6">i</tspan><tspan dy="-4.6"></tspan> = A<tspan font-size="11" dy="4.6">s</tspan><tspan dy="-4.6"></tspan> s<tspan font-size="11" dy="4.6">i-1</tspan><tspan dy="-4.6"></tspan> + B<tspan font-size="11" dy="4.6">s</tspan><tspan dy="-4.6"></tspan> x<tspan font-size="11" dy="4.6">i</tspan><tspan dy="-4.6"></tspan>          |          across frames:  s<tspan font-size="11" dy="4.6">t</tspan><tspan dy="-4.6"></tspan> = A<tspan font-size="11" dy="4.6">t</tspan><tspan dy="-4.6"></tspan> s<tspan font-size="11" dy="4.6">t-1</tspan><tspan dy="-4.6"></tspan> + B<tspan font-size="11" dy="4.6">t</tspan><tspan dy="-4.6"></tspan> z<tspan font-size="11" dy="4.6">t</tspan><tspan dy="-4.6"></tspan></text>
<text x="470.0" y="587" font-size="11.5" text-anchor="middle" fill="#6C786C">both reduce to identity when their A is zero, so the arm nests both controls</text>
<rect x="48" y="624" width="844" height="178" rx="8" fill="#FFFFFF" stroke="#546060" stroke-width="1.6"/>
<text x="470.0" y="650" font-size="17" text-anchor="middle" fill="#546060" font-weight="bold">THE ABLATION MAP</text>
<text x="470.0" y="669" font-size="12" text-anchor="middle" fill="#6C786C">every cell already exists or is in this round</text>
