<text x="380.0" y="356" font-size="17" text-anchor="middle" fill="#C88A1E" font-weight="bold">THE NEW COMPONENT</text>
<text x="380.0" y="375" font-size="12" text-anchor="middle" fill="#6C786C">one recurrence, shared across frames and across tokens</text>
