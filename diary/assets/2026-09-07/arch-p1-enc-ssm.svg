<text x="335.0" y="1519" font-size="12" text-anchor="middle" fill="#6C786C">A = 0 is</text>
<text x="335.0" y="1538" font-size="16" text-anchor="middle" fill="#A83024" font-weight="bold">bit-identical</text>
<rect x="432" y="1502" width="178" height="44" rx="6" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.3" stroke-opacity="0.75"/>
