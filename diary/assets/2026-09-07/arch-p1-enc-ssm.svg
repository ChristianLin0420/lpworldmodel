<text x="470.0" y="46" font-size="20" text-anchor="middle" fill="#14231C" font-weight="bold">(P1)  PiWM-enc-ssm –  a temporal state after the per-frame encoder</text>
<text x="470.0" y="72" font-size="13" text-anchor="middle" fill="#6C786C">the ViT is untouched; three matrices are added on top of its output</text>
