<text x="670" y="1176" font-size="11.5" text-anchor="middle" fill="#6C786C">no history to flow from</text>
<text x="470" y="1210" font-size="12" text-anchor="middle" fill="#C88A1E" font-weight="bold">an SSM at T = 1 gives z = C B z  –  a function of THAT frame alone. attention does not.</text>
<rect x="60" y="1262" width="400" height="214" rx="8" fill="#FFFFFF" stroke="#A83024" stroke-width="1.6"/>
<text x="260.0" y="1288" font-size="17" text-anchor="middle" fill="#A83024" font-weight="bold">blockcausal  –  no T = 1 limit</text>
<text x="260.0" y="1307" font-size="12" text-anchor="middle" fill="#6C786C">z_goal is an object training never produced</text>
<text x="96" y="1334" font-size="12" text-anchor="start" fill="#14231C">each frame attends to earlier ones</text>
<text x="96" y="1364" font-size="12" text-anchor="start" fill="#14231C">at T = 1 there is nothing to attend to</text>
<text x="96" y="1394" font-size="12" text-anchor="start" fill="#14231C">so the goal is off-distribution</text>
<text x="96" y="1424" font-size="12" text-anchor="start" fill="#A83024">success 0.00, three times</text>
<rect x="476" y="1262" width="400" height="214" rx="8" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.6"/>
<text x="676.0" y="1288" font-size="17" text-anchor="middle" fill="#C88A1E" font-weight="bold">enc-ssm  –  exact at T = 1</text>
<text x="676.0" y="1307" font-size="12" text-anchor="middle" fill="#6C786C">A = 0 reproduces the per-frame encoder bit-for-bit</text>
<text x="512" y="1334" font-size="12" text-anchor="start" fill="#14231C">s starts at zero, A·0 = 0 exactly</text>
<text x="512" y="1364" font-size="12" text-anchor="start" fill="#14231C">T = 1 gives z = C B z, well defined</text>
<text x="512" y="1394" font-size="12" text-anchor="start" fill="#14231C">A = 0 init  ⇒  arm IS the baseline</text>
<text x="512" y="1424" font-size="12" text-anchor="start" fill="#C88A1E">control: A allocated but frozen</text>
<rect x="60" y="1502" width="178" height="44" rx="6" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="149.0" y="1519" font-size="12" text-anchor="middle" fill="#6C786C">new params</text>
<text x="149.0" y="1538" font-size="16" text-anchor="middle" fill="#A83024" font-weight="bold">3 × DΣ</text>
