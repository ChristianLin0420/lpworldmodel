<text x="748.0" y="516.0" font-size="15" text-anchor="middle" fill="#14231C">Pred</text>
<path d="M796,510 L848,510" stroke="#543C84" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e5)"/>
<text x="860.9" y="516" font-size="15" text-anchor="start" fill="#543C84" font-weight="bold">z<tspan font-size="10" dy="4.2">t+4</tspan><tspan dy="-4.2"></tspan></text>
<path d="M862.5,500 L867,494.5 L871.5,500" stroke="#543C84" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="48" y="556" width="844" height="70" rx="6" fill="#F7E8C8" stroke="#C88A1E" stroke-width="1.2" opacity="0.55"/>
<text x="355.7" y="589" font-size="15.5" text-anchor="start" fill="#14231C" font-weight="bold">s<tspan font-size="11" dy="4.6">t</tspan><tspan dy="-4.6"></tspan> = A s<tspan font-size="11" dy="4.6">t-1</tspan><tspan dy="-4.6"></tspan> + B z<tspan font-size="11" dy="4.6">t</tspan><tspan dy="-4.6"></tspan>      ·      z′<tspan font-size="11" dy="4.6">t</tspan><tspan dy="-4.6"></tspan> = C s<tspan font-size="11" dy="4.6">t</tspan><tspan dy="-4.6"></tspan></text>
<text x="470.0" y="613" font-size="11.5" text-anchor="middle" fill="#6C786C">three nn.Linear(D, D, bias=False); D = 384; no change to the ViT</text>
<rect x="48" y="650" width="412" height="214" rx="8" fill="#FFFFFF" stroke="#18483C" stroke-width="1.6"/>
<text x="254.0" y="676" font-size="17" text-anchor="middle" fill="#18483C" font-weight="bold">THE CONTRACT  –  A = 0 is the baseline</text>
<text x="254.0" y="695" font-size="12" text-anchor="middle" fill="#6C786C">verified by loss_trace bit-identity, not by inspection</text>
<text x="84" y="722" font-size="12.5" text-anchor="start" fill="#14231C">A = 0, B = C = I at init</text>
<text x="84" y="752" font-size="12.5" text-anchor="start" fill="#14231C">s<tspan font-size="10" dy="4.2">0</tspan><tspan dy="-4.2"></tspan> = 0, so A·0 = 0 exactly</text>
<text x="84" y="782" font-size="12.5" text-anchor="start" fill="#14231C">z′<tspan font-size="10" dy="4.2">t</tspan><tspan dy="-4.2"></tspan> = z<tspan font-size="10" dy="4.2">t</tspan><tspan dy="-4.2"></tspan> for every t, and for T = 1</text>
<text x="84" y="812" font-size="12.5" text-anchor="start" fill="#18483C">so z_goal is the baseline's z_goal</text>
<rect x="488" y="650" width="404" height="214" rx="8" fill="#FFFFFF" stroke="#543C84" stroke-width="1.6"/>
<text x="690.0" y="676" font-size="17" text-anchor="middle" fill="#543C84" font-weight="bold">THE CONTROL  –  enc-ssm-frozen</text>
<text x="690.0" y="695" font-size="12" text-anchor="middle" fill="#6C786C">same parameters, same ops, same RNG draw</text>
<text x="524" y="722" font-size="12.5" text-anchor="start" fill="#14231C">A allocated and zero-initialised</text>
<text x="524" y="752" font-size="12.5" text-anchor="start" fill="#14231C">A.requires_grad_(False)</text>
<text x="524" y="782" font-size="12.5" text-anchor="start" fill="#14231C">state cannot flow, capacity identical</text>
<text x="524" y="812" font-size="12.5" text-anchor="start" fill="#543C84">a win here is STATE, not parameters</text>
