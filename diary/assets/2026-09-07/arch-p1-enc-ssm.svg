<text x="54" y="930" font-size="18" text-anchor="start" fill="#C88A1E" font-weight="bold">s<tspan font-size="12" dy="5.0">t</tspan><tspan dy="-5.0"></tspan> = A s<tspan font-size="12" dy="5.0">t-1</tspan><tspan dy="-5.0"></tspan> + B z<tspan font-size="12" dy="5.0">t</tspan><tspan dy="-5.0"></tspan> ,   z<tspan font-size="12" dy="5.0">t</tspan><tspan dy="-5.0"></tspan> = C s<tspan font-size="12" dy="5.0">t</tspan><tspan dy="-5.0"></tspan>      A = 0 at init  ⇒  identical to today</text>
