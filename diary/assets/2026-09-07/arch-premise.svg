<text x="685.0" y="215.25" font-size="15" text-anchor="start" fill="#14231C">o<tspan font-size="10" dy="4.2">g</tspan><tspan dy="-4.2"></tspan></text>
<path d="M692,236 L692,274" stroke="#A83024" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e1)"/>
<rect x="646" y="274" width="92" height="44" rx="6" fill="#FFFFFF" stroke="#A83024" stroke-width="1.8"/>
<text x="692.0" y="302.0" font-size="15" text-anchor="middle" fill="#14231C">Enc</text>
<path d="M692,318 L692,356" stroke="#A83024" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#e1)"/>
<text x="685.2" y="378" font-size="15" text-anchor="start" fill="#A83024" font-weight="bold">z<tspan font-size="10" dy="4.2">g</tspan><tspan dy="-4.2"></tspan></text>
<text x="692" y="412" font-size="12.5" text-anchor="middle" fill="#A83024" font-weight="bold">nothing to attend to</text>
<text x="692" y="436" font-size="11" text-anchor="middle" fill="#6C786C">z_goal is an object training never produced</text>
<text x="692" y="470" font-size="12" text-anchor="middle" fill="#A83024">the planner aims at it anyway</text>
<rect x="48" y="528" width="844" height="70" rx="6" fill="#F5E2E0" stroke="#A83024" stroke-width="1.2" opacity="0.55"/>
<text x="115.3" y="561" font-size="15.5" text-anchor="start" fill="#14231C" font-weight="bold">attention over a length-1 sequence is a DIFFERENT function; an SSM with s<tspan font-size="11" dy="4.6">0</tspan><tspan dy="-4.6"></tspan> = 0 is the same one</text>
<text x="470.0" y="585" font-size="11.5" text-anchor="middle" fill="#6C786C">which is why round 9 uses a state-space operator and not attention</text>
<rect x="48" y="622" width="844" height="268" rx="8" fill="#FFFFFF" stroke="#546060" stroke-width="1.6"/>
<text x="470.0" y="648" font-size="17" text-anchor="middle" fill="#546060" font-weight="bold">IT IS NOT SIMPLY "LOW ERROR IS BAD"</text>
<text x="470.0" y="667" font-size="12" text-anchor="middle" fill="#6C786C">the five lowest rel_mse in 96 arms -- four have a dead code, one does not</text>
