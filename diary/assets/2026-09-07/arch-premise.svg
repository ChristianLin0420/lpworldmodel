<text x="258.0" y="130" font-size="17" text-anchor="middle" fill="#18483C" font-weight="bold">TRAINING  –  the encoder sees T = 3</text>
<text x="258.0" y="149" font-size="12" text-anchor="middle" fill="#6C786C">every frame attends to the earlier ones</text>
<circle cx="162" cy="210" r="26" fill="#FFFFFF" stroke="#546060" stroke-width="1.8"/>
<text x="156.4" y="215.25" font-size="15" text-anchor="start" fill="#14231C">o<tspan font-size="10" dy="4.2">t</tspan><tspan dy="-4.2"></tspan></text>
