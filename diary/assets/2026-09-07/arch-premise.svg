<text x="692.0" y="130" font-size="17" text-anchor="middle" fill="#A83024" font-weight="bold">GOAL  –  the encoder sees T = 1</text>
<text x="692.0" y="149" font-size="12" text-anchor="middle" fill="#6C786C">planning/cem.py:77 with plan.py:233</text>
