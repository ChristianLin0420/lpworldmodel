<rect width="940" height="934" fill="#FFFFFF"/>
<text x="470.0" y="46" font-size="20" text-anchor="middle" fill="#14231C" font-weight="bold">Why a stateful encoder needs an EXACT single-frame limit</text>
<text x="470.0" y="72" font-size="13" text-anchor="middle" fill="#6C786C">PiWM-blockcausal: best fit in the archive, full-rank code, and success 0.00</text>
