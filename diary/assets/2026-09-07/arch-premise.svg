<text x="100" y="292" font-size="10.5" text-anchor="end" fill="#6C786C">shared</text>
<text x="100" y="306" font-size="10.5" text-anchor="end" fill="#6C786C">weights</text>
<path d="M192,296 L236,296" stroke="#18483C" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#e0)"/>
<path d="M296,296 L340,296" stroke="#18483C" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#e0)"/>
<text x="258" y="452" font-size="12" text-anchor="middle" fill="#18483C" font-weight="bold">z depends on the whole clip</text>
