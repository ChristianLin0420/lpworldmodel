<text x="170" y="594" font-size="13.5" text-anchor="start" fill="#14231C" font-weight="bold">Forcing the code to carry inter-frame MOTION competes directly with carrying what ACTIONS do.</text>
<text x="170" y="616" font-size="12.5" text-anchor="start" fill="#6C786C">A trade-off, not a null: the objective is not ignored, it is satisfied at the cost of the thing planning needs. 5 of 6 runs fit; pushT s5 does not.</text>
