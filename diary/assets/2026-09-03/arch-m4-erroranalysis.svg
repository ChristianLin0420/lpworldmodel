<text x="816.0" y="1154" font-size="12" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">position solved, theta</text>
<text x="816.0" y="1173" font-size="12" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">not -- the angular term</text>
<text x="816.0" y="1192" font-size="12" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">is what fails</text>
<text x="60" y="1252" font-size="15" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">the three tests are ordered and mutually exclusive, so the four counts partition the failures and sum to the failure rate.</text>
<text x="60" y="1278" font-size="14" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">n_contacts (env/pusht/pusht_env.py:578) and the per-step block pose are already computed; pusht_wrapper.rollout:103-118 drops both.</text>
