<text x="159.0" y="1362" font-size="16" text-anchor="middle" fill="#b3261e" font-style="" font-weight="bold">eval only, never in loss</text>
<rect x="266" y="1326" width="198" height="44" rx="5" fill="#FFFFFF" stroke="#006e00" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="365.0" y="1343" font-size="12" text-anchor="middle" fill="#555" font-style="" font-weight="normal">oracle dynamics</text>
<text x="365.0" y="1362" font-size="16" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="bold">the simulator itself</text>
