<text x="365.0" y="1293" font-size="12" text-anchor="middle" fill="#6C786C">oracle dynamics</text>
<text x="365.0" y="1312" font-size="16" text-anchor="middle" fill="#14231C" font-weight="bold">the simulator itself</text>
