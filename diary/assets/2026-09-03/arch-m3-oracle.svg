<text x="310" y="106" font-size="16" text-anchor="start" fill="#006e00" font-style="" font-weight="normal">dynamics:  this predictor  OR  the simulator</text>
<text x="438" y="382" font-size="15" text-anchor="start" fill="#006e00" font-style="" font-weight="normal">objective: latent MSE  OR  true task distance</text>
<path d="M712,378 L766,378 L766,344" stroke="#006e00" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5,3"/>
