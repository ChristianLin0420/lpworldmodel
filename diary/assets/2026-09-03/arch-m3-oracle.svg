<text x="701.0" y="932" font-size="16" text-anchor="middle" fill="#14231C" font-weight="bold">OBJECTIVE  =  oracle</text>
<text x="701.0" y="952" font-size="12.5" text-anchor="middle" fill="#6C786C">true task distance, block pose</text>
<text x="140" y="1002.0" font-size="13" text-anchor="end" fill="#14231C" font-weight="bold">DYNAMICS</text>
<text x="140" y="1022.0" font-size="13" text-anchor="end" fill="#14231C">=  learned</text>
<text x="140" y="1042.0" font-size="11" text-anchor="end" fill="#6C786C">predictor</text>
<text x="140" y="1058.0" font-size="11" text-anchor="end" fill="#6C786C">rolls z</text>
<text x="140" y="1160.0" font-size="13" text-anchor="end" fill="#14231C" font-weight="bold">DYNAMICS</text>
<text x="140" y="1180.0" font-size="13" text-anchor="end" fill="#14231C">=  oracle</text>
<text x="140" y="1200.0" font-size="11" text-anchor="end" fill="#6C786C">simulator</text>
<text x="140" y="1216.0" font-size="11" text-anchor="end" fill="#6C786C">rolls state</text>
<rect x="152" y="966" width="350" height="136" rx="10" fill="#F5E2E0" stroke="#A83024" stroke-width="2.2"/>
<text x="327.0" y="996" font-size="18" text-anchor="middle" fill="#A83024" font-weight="bold">AS SHIPPED</text>
<text x="327.0" y="1016" font-size="12" text-anchor="middle" fill="#6C786C">CEM 0.357 ltv / 0.080 linvar   –   measured</text>
<rect x="168" y="1028" width="318" height="62" rx="6" fill="#FFFFFF" stroke="#A83024" stroke-width="1.3" stroke-opacity="0.7"/>
<text x="180" y="1051" font-size="12.5" text-anchor="start" fill="#14231C">high  ⇒  nothing below this is needed</text>
<text x="180" y="1074" font-size="12.5" text-anchor="start" fill="#14231C">low   ⇒  the fault is in one of the other 3</text>
<rect x="526" y="966" width="350" height="136" rx="10" fill="#DED6EA" stroke="#543C84" stroke-width="2.2"/>
<text x="701.0" y="996" font-size="18" text-anchor="middle" fill="#543C84" font-weight="bold">PROBE THE ROLLOUT</text>
<text x="701.0" y="1016" font-size="12" text-anchor="middle" fill="#6C786C">the M1 probe reads pose out of the model's roll</text>
<rect x="542" y="1028" width="318" height="62" rx="6" fill="#FFFFFF" stroke="#543C84" stroke-width="1.3" stroke-opacity="0.7"/>
<text x="554" y="1051" font-size="12.5" text-anchor="start" fill="#14231C">high  ⇒  the roll carries it; the METRIC fails</text>
<text x="554" y="1074" font-size="12.5" text-anchor="start" fill="#14231C">low   ⇒  the rollout loses the block entirely</text>
<rect x="152" y="1124" width="350" height="136" rx="10" fill="#F7E8C8" stroke="#C88A1E" stroke-width="2.2"/>
<text x="327.0" y="1154" font-size="18" text-anchor="middle" fill="#C88A1E" font-weight="bold">SIM ROLLS, LATENT SCORES</text>
<text x="327.0" y="1174" font-size="12" text-anchor="middle" fill="#6C786C">the simulator rolls the true state, then encode</text>
<rect x="168" y="1186" width="318" height="62" rx="6" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.3" stroke-opacity="0.7"/>
<text x="180" y="1209" font-size="12.5" text-anchor="start" fill="#14231C">high  ⇒  the metric is fine; DYNAMICS at fault</text>
<text x="180" y="1232" font-size="12.5" text-anchor="start" fill="#14231C">low   ⇒  it cannot rank even PERFECT rollouts</text>
<rect x="526" y="1124" width="350" height="136" rx="10" fill="#D8F0E4" stroke="#18483C" stroke-width="2.2"/>
<text x="701.0" y="1154" font-size="18" text-anchor="middle" fill="#18483C" font-weight="bold">THE CEILING</text>
<text x="701.0" y="1174" font-size="12" text-anchor="middle" fill="#6C786C">simulator + true task distance  –  no learning</text>
<rect x="542" y="1186" width="318" height="62" rx="6" fill="#FFFFFF" stroke="#18483C" stroke-width="1.3" stroke-opacity="0.7"/>
<text x="554" y="1209" font-size="12.5" text-anchor="start" fill="#14231C">high  ⇒  the ceiling; the rest is model error</text>
<text x="554" y="1232" font-size="12.5" text-anchor="start" fill="#14231C">low   ⇒  H=5 / 300 / 30  –  the PLANNER fails</text>
<rect x="60" y="1276" width="198" height="44" rx="6" fill="#FFFFFF" stroke="#2E7D6F" stroke-width="1.3" stroke-opacity="0.75"/>
<text x="159.0" y="1293" font-size="12" text-anchor="middle" fill="#6C786C">privileged state</text>
<text x="159.0" y="1312" font-size="16" text-anchor="middle" fill="#A83024" font-weight="bold">eval only, never in loss</text>
