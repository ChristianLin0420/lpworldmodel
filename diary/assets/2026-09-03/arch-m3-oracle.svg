<text x="54" y="930" font-size="18" text-anchor="start" fill="#006e00" font-style="" font-weight="bold">module:  swap one half at a time; each cell says what its result would mean</text>
<path d="M52,942 L888,942" stroke="#006e00" stroke-width="1.2" stroke-opacity="0.5"/>
<text x="328.0" y="982" font-size="16" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="bold">OBJECTIVE  =  learned</text>
<text x="328.0" y="1002" font-size="12.5" text-anchor="middle" fill="#6b6b66" font-style="" font-weight="normal">latent distance to z_goal</text>
<text x="710.0" y="982" font-size="16" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="bold">OBJECTIVE  =  oracle</text>
<text x="710.0" y="1002" font-size="12.5" text-anchor="middle" fill="#6b6b66" font-style="" font-weight="normal">true task distance, block pose</text>
<text x="142" y="1062.0" font-size="13" text-anchor="end" fill="#1A1A1A" font-style="" font-weight="bold">DYNAMICS</text>
<text x="142" y="1082.0" font-size="13" text-anchor="end" fill="#1A1A1A" font-style="" font-weight="normal">=  learned</text>
<text x="142" y="1102.0" font-size="11" text-anchor="end" fill="#6b6b66" font-style="" font-weight="normal">predictor rolls z</text>
<text x="142" y="1220.0" font-size="13" text-anchor="end" fill="#1A1A1A" font-style="" font-weight="bold">DYNAMICS</text>
<text x="142" y="1240.0" font-size="13" text-anchor="end" fill="#1A1A1A" font-style="" font-weight="normal">=  oracle</text>
<text x="142" y="1260.0" font-size="11" text-anchor="end" fill="#6b6b66" font-style="" font-weight="normal">simulator rolls state</text>
<rect x="150" y="1016" width="356" height="136" rx="10" fill="#f7dcd9" stroke="#b3261e" stroke-width="2.6"/>
<text x="328.0" y="1046" font-size="18" text-anchor="middle" fill="#b3261e" font-style="" font-weight="bold">AS SHIPPED</text>
<text x="328.0" y="1066" font-size="12" text-anchor="middle" fill="#6b6b66" font-style="" font-weight="normal">CEM 0.357 ltv / 0.080 linvar  --  measured</text>
<rect x="166" y="1076" width="324" height="64" rx="5" fill="#FFFFFF" stroke="#b3261e" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="178" y="1100" font-size="12.5" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">high  =>  nothing below this is needed</text>
<text x="178" y="1124" font-size="12.5" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">low   =>  the fault is in one of the other 3</text>
<rect x="532" y="1016" width="356" height="136" rx="10" fill="#d8e8fb" stroke="#0055af" stroke-width="2.6"/>
<text x="710.0" y="1046" font-size="18" text-anchor="middle" fill="#0055af" font-style="" font-weight="bold">PROBE THE ROLLOUT</text>
<text x="710.0" y="1066" font-size="12" text-anchor="middle" fill="#6b6b66" font-style="" font-weight="normal">the M1 probe reads pose out of the model's roll</text>
<rect x="548" y="1076" width="324" height="64" rx="5" fill="#FFFFFF" stroke="#0055af" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="560" y="1100" font-size="12.5" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">high  =>  the roll carries it; the METRIC fails</text>
<text x="560" y="1124" font-size="12.5" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">low   =>  the rollout loses the block entirely</text>
<rect x="150" y="1174" width="356" height="136" rx="10" fill="#faeecb" stroke="#9a6700" stroke-width="2.6"/>
<text x="328.0" y="1204" font-size="18" text-anchor="middle" fill="#9a6700" font-style="" font-weight="bold">SIM ROLLS, LATENT SCORES</text>
<text x="328.0" y="1224" font-size="12" text-anchor="middle" fill="#6b6b66" font-style="" font-weight="normal">the simulator rolls the true state, then encode</text>
<rect x="166" y="1234" width="324" height="64" rx="5" fill="#FFFFFF" stroke="#9a6700" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="178" y="1258" font-size="12.5" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">high  =>  the metric is fine; DYNAMICS at fault</text>
<text x="178" y="1282" font-size="12.5" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">low   =>  it cannot rank even PERFECT rollouts</text>
<rect x="532" y="1174" width="356" height="136" rx="10" fill="#d9efd7" stroke="#006e00" stroke-width="2.6"/>
<text x="710.0" y="1204" font-size="18" text-anchor="middle" fill="#006e00" font-style="" font-weight="bold">THE CEILING</text>
<text x="710.0" y="1224" font-size="12" text-anchor="middle" fill="#6b6b66" font-style="" font-weight="normal">simulator + true task distance -- no learning</text>
<rect x="548" y="1234" width="324" height="64" rx="5" fill="#FFFFFF" stroke="#006e00" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="560" y="1258" font-size="12.5" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">high  =>  the ceiling; the rest is model error</text>
<text x="560" y="1282" font-size="12.5" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">low   =>  H=5 / 300 / 30 -- the PLANNER fails</text>
