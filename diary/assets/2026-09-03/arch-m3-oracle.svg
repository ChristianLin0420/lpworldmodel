<text x="571.0" y="1343" font-size="12" text-anchor="middle" fill="#555" font-style="" font-weight="normal">oracle objective</text>
<text x="571.0" y="1362" font-size="16" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="bold">block pose distance</text>
<rect x="678" y="1326" width="198" height="44" rx="5" fill="#FFFFFF" stroke="#006e00" stroke-width="1.4" stroke-opacity="0.7"/>
