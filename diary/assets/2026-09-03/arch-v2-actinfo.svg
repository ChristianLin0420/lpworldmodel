<text x="460.0" y="643" font-size="13" text-anchor="middle" fill="#912d59" font-style="" font-weight="bold">Proposed: make the objective CAUSAL, not merely predictive</text>
<text x="460.0" y="661" font-size="13" text-anchor="middle" fill="#912d59" font-style="" font-weight="normal">The true z_t+1 must be better explained by the action TAKEN than by actions that were not.</text>
<text x="460.0" y="679" font-size="13" text-anchor="middle" fill="#912d59" font-style="" font-weight="normal">Negatives are free (permute a within the batch); the predictor is 0.81M params vs the</text>
<text x="460.0" y="697" font-size="13" text-anchor="middle" fill="#912d59" font-style="" font-weight="normal">encoder's 12.56M, so K=4 negatives cost almost nothing. tau = detached mean energy.</text>
<text x="460.0" y="715" font-size="13" text-anchor="middle" fill="#912d59" font-style="" font-weight="normal">MEASURED (n=8): d_action 0.699 -- the highest of any arm -- but rho 0.448 -> 0.052.</text>
<text x="460.0" y="733" font-size="13" text-anchor="middle" fill="#912d59" font-style="" font-weight="normal">It bought action-sensitivity by COLLAPSING the code, which is not the trade we wanted.</text>
<text x="470" y="872" font-size="21" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">(V2) PiWM-actinfo -- InfoNCE over actions</text>
