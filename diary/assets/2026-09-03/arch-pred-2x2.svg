<rect width="940" height="668" fill="#FFFFFF"/>
<text x="40" y="52" font-size="22" text-anchor="start" fill="#14231C" font-weight="bold">The 2x2 nobody ran: how the action enters the predictor</text>
<text x="40" y="77" font-size="14" text-anchor="start" fill="#6C786C">36 of 39 campaign arms use one cell of this table, plus a ReLU readout and a low-rank gate</text>
<text x="346.0" y="134" font-size="14" text-anchor="middle" fill="#6C786C">the action is a BIAS</text>
<text x="730.0" y="134" font-size="14" text-anchor="middle" fill="#6C786C">the action is an OPERATOR</text>
<rect x="168" y="152" width="356" height="176" rx="10" fill="#DFE4E4" stroke="#546060" stroke-width="2.2"/>
<rect x="412.4" y="166" width="95.6" height="22" rx="11" fill="#FFFFFF" stroke="#546060" stroke-width="1.3"/>
<text x="460.20624999999995" y="181.5" font-size="12.5" text-anchor="middle" fill="#546060" font-weight="bold">NEVER RUN</text>
<text x="346.0" y="220" font-size="21" text-anchor="middle" fill="#546060" font-weight="bold">linear_wb</text>
<text x="346.0" y="242" font-size="12.5" text-anchor="middle" fill="#6C786C">1 lag, additive</text>
<rect x="184" y="260" width="324" height="52" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.4"/>
<text x="294.6" y="292" font-size="15" text-anchor="start" fill="#14231C">u = W z</text>
<text x="345.87" y="292" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="13" dy="5.5">t</tspan><tspan dy="-5.5"></tspan></text>
<text x="349.484" y="292" font-size="15" text-anchor="start" fill="#14231C">  +  B a</text>
<rect x="552" y="152" width="356" height="176" rx="10" fill="#F7E8C8" stroke="#C88A1E" stroke-width="2.2"/>
<rect x="796.4" y="166" width="95.6" height="22" rx="11" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.3"/>
<text x="844.20625" y="181.5" font-size="12.5" text-anchor="middle" fill="#C88A1E" font-weight="bold">NEVER RUN</text>
<text x="730.0" y="220" font-size="21" text-anchor="middle" fill="#C88A1E" font-weight="bold">linear_pa</text>
<text x="730.0" y="242" font-size="12.5" text-anchor="middle" fill="#6C786C">1 lag, multiplicative</text>
<rect x="568" y="260" width="324" height="52" rx="6" fill="#FFFFFF" stroke="#C88A1E" stroke-width="1.4"/>
<text x="628.1" y="292" font-size="15" text-anchor="start" fill="#14231C">u = [ diag(d(a)) + U(a)V(a)</text>
<text x="801.485" y="292" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="11" dy="-10.4">T</tspan><tspan dy="10.4"></tspan></text>
<text x="808.206" y="292" font-size="15" text-anchor="start" fill="#14231C"> ] z</text>
<text x="828.216" y="292" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="13" dy="5.5">t</tspan><tspan dy="-5.5"></tspan></text>
<rect x="168" y="356" width="356" height="176" rx="10" fill="#DFE4E4" stroke="#546060" stroke-width="2.2"/>
<rect x="412.4" y="370" width="95.6" height="22" rx="11" fill="#FFFFFF" stroke="#546060" stroke-width="1.3"/>
<text x="460.20624999999995" y="385.5" font-size="12.5" text-anchor="middle" fill="#546060" font-weight="bold">NEVER RUN</text>
<text x="346.0" y="424" font-size="21" text-anchor="middle" fill="#546060" font-weight="bold">linear_var</text>
<text x="346.0" y="446" font-size="12.5" text-anchor="middle" fill="#6C786C">3 lags, additive</text>
<rect x="184" y="464" width="324" height="52" rx="6" fill="#FFFFFF" stroke="#546060" stroke-width="1.4"/>
<text x="278.0" y="496" font-size="15" text-anchor="start" fill="#14231C">u = Σ</text>
<text x="312.71" y="496" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="13" dy="5.5">k</tspan><tspan dy="-5.5"></tspan></text>
<text x="319.21" y="496" font-size="15" text-anchor="start" fill="#14231C"> A</text>
<text x="333.385" y="496" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="13" dy="5.5">k</tspan><tspan dy="-5.5"></tspan></text>
<text x="339.885" y="496" font-size="15" text-anchor="start" fill="#14231C"> z</text>
<text x="351.555" y="496" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="13" dy="5.5">t-k</tspan><tspan dy="-5.5"></tspan></text>
<text x="365.998" y="496" font-size="15" text-anchor="start" fill="#14231C">  +  B a</text>
<rect x="552" y="356" width="356" height="176" rx="10" fill="#DCEFE9" stroke="#2E7D6F" stroke-width="2.2"/>
<rect x="840.8" y="370" width="51.2" height="22" rx="11" fill="#FFFFFF" stroke="#2E7D6F" stroke-width="1.3"/>
<text x="866.3812499999999" y="385.5" font-size="12.5" text-anchor="middle" fill="#2E7D6F" font-weight="bold">NEW</text>
<text x="730.0" y="424" font-size="21" text-anchor="middle" fill="#2E7D6F" font-weight="bold">lie   (P1)</text>
<text x="730.0" y="446" font-size="12.5" text-anchor="middle" fill="#6C786C">3 lags, multiplicative</text>
<rect x="568" y="464" width="324" height="52" rx="6" fill="#FFFFFF" stroke="#2E7D6F" stroke-width="1.4"/>
<text x="649.9" y="496" font-size="15" text-anchor="start" fill="#14231C">u = R(θ(a)) Σ</text>
<text x="736.27" y="496" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="13" dy="5.5">k</tspan><tspan dy="-5.5"></tspan></text>
<text x="742.77" y="496" font-size="15" text-anchor="start" fill="#14231C"> R(φ</text>
<text x="772.485" y="496" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="13" dy="5.5">k</tspan><tspan dy="-5.5"></tspan></text>
<text x="778.985" y="496" font-size="15" text-anchor="start" fill="#14231C">) z</text>
<text x="795.65" y="496" font-size="15" text-anchor="start" fill="#14231C"><tspan font-size="13" dy="5.5">t-k</tspan><tspan dy="-5.5"></tspan></text>
<text x="150" y="246.0" font-size="16" text-anchor="end" fill="#14231C">1 lag</text>
<text x="150" y="450.0" font-size="16" text-anchor="end" fill="#14231C">3 lags</text>
<text x="40" y="582" font-size="16" text-anchor="start" fill="#14231C">ltv  =  the BOTTOM-LEFT cell  +  ReLU readout  +  low-rank gate  —  36 of 39 arms</text>
<text x="40" y="608" font-size="13" text-anchor="start" fill="#6C786C">The campaign varied the link, the target, the regulariser, the loss, sparsity, width, LR, the encoder, the conditioning and the head count —</text>
<text x="40" y="628" font-size="13" text-anchor="start" fill="#6C786C">and held this table fixed.</text>
