<path d="M612,1282 L832,1282" stroke="#006e00" stroke-width="2.4" fill="none" marker-end="url(#a)"/>
<text x="730" y="1330" font-size="11" text-anchor="middle" fill="#006e00" font-style="" font-weight="bold">moves the block</text>
<text x="60" y="1374" font-size="16" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">L_veq  =  ( V-bar( P( z , a ) , g ) - V-bar( z_t+1 , g ) )<tspan font-size="12" dy="-8">2</tspan><tspan dy="8"> </tspan></text>
<text x="600" y="1374" font-size="15" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">the target side is detached</text>
<text x="60" y="1400" font-size="14" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">the latent MSE weights every transition equally; this one weights each by how much the VALUE moves -- so the 48% no-ops cost ~0</text>
<rect x="60" y="1414" width="198" height="44" rx="5" fill="#FFFFFF" stroke="#006e00" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="159.0" y="1431" font-size="12" text-anchor="middle" fill="#555" font-style="" font-weight="normal">fully static</text>
<text x="159.0" y="1450" font-size="16" text-anchor="middle" fill="#b3261e" font-style="" font-weight="bold">48% of transitions</text>
<rect x="266" y="1414" width="198" height="44" rx="5" fill="#FFFFFF" stroke="#006e00" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="365.0" y="1431" font-size="12" text-anchor="middle" fill="#555" font-style="" font-weight="normal">block moves &gt; 0.5 px</text>
<text x="365.0" y="1450" font-size="16" text-anchor="middle" fill="#b3261e" font-style="" font-weight="bold">25.3%</text>
<rect x="472" y="1414" width="198" height="44" rx="5" fill="#FFFFFF" stroke="#006e00" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="571.0" y="1431" font-size="12" text-anchor="middle" fill="#555" font-style="" font-weight="normal">top 1% carry</text>
<text x="571.0" y="1450" font-size="16" text-anchor="middle" fill="#b3261e" font-style="" font-weight="bold">34.8% of all motion</text>
<rect x="678" y="1414" width="198" height="44" rx="5" fill="#FFFFFF" stroke="#006e00" stroke-width="1.4" stroke-opacity="0.7"/>
<text x="777.0" y="1431" font-size="12" text-anchor="middle" fill="#555" font-style="" font-weight="normal">V comes from</text>
<text x="777.0" y="1450" font-size="16" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="bold">T4, frozen</text>
