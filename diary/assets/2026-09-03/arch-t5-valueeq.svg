<rect x="60" y="1210" width="440" height="134" rx="8" fill="#FFFFFF" stroke="#006e00" stroke-width="2"/>
<text x="280.0" y="1236" font-size="17" text-anchor="middle" fill="#006e00" font-style="" font-weight="bold">only value-relevant error costs anything</text>
<text x="80" y="1272" font-size="16" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">L  =  ( v_pred  -  v_tgt )<tspan font-size="12" dy="-8">2</tspan><tspan dy="8"> </tspan></text>
<text x="80" y="1302" font-size="16" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">=  dz^T M dz  +  higher order</text>
<text x="80" y="1330" font-size="14" text-anchor="start" fill="#1A1A1A" font-style="" font-weight="normal">M  =  grad V grad V^T   --   rank 1 in D = 384</text>
<rect x="520" y="1210" width="356" height="134" rx="8" fill="#FFFFFF" stroke="#006e00" stroke-width="2"/>
<text x="698.0" y="1236" font-size="17" text-anchor="middle" fill="#006e00" font-style="" font-weight="bold">the metric it induces</text>
<text x="698" y="1252" font-size="11.5" text-anchor="middle" fill="#555" font-style="" font-weight="normal">level sets of V( . , g )</text>
