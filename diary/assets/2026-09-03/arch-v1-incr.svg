<text x="466" y="872" font-size="21" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">(V1) PiWM-incr -- per-sample increment normalisation  [COLLAPSED]</text>
<rect x="560" y="300" width="250" height="66" rx="4" fill="#d8e8fb" stroke="#0055af" stroke-width="2.4"/>
<text x="685.0" y="334.0" font-size="15" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">w = 1 / (||dz||^2 + eps)</text>
<text x="685.0" y="351.0" font-size="12" text-anchor="middle" fill="#444" font-style="" font-weight="normal">applied per sample, not per batch</text>
<path d="M737,292 L737,276" stroke="#0055af" stroke-width="2.2" fill="none" marker-end="url(#a)" stroke-dasharray="6,4"/>
<rect x="186" y="636" width="570" height="134" rx="7" fill="#d8e8fb" fill-opacity="0.75" stroke="#0055af" stroke-width="2" stroke-dasharray="7,4"/>
<text x="471.0" y="657" font-size="13" text-anchor="middle" fill="#0055af" font-style="" font-weight="bold">Proposed: stop large autonomous motions dominating the loss</text>
<text x="471.0" y="675" font-size="13" text-anchor="middle" fill="#0055af" font-style="" font-weight="normal">'Loss on the increment' is a NO-OP: (zhat - z_t) - (z_t+1 - z_t) = zhat - z_t+1 exactly.</text>
<text x="471.0" y="693" font-size="13" text-anchor="middle" fill="#0055af" font-style="" font-weight="normal">A BATCH-level normaliser only rescales. Only PER-SAMPLE weighting moves the gradient.</text>
<text x="471.0" y="711" font-size="13" text-anchor="middle" fill="#0055af" font-style="" font-weight="normal">MEASURED FAILURE (LpWM-ltv s3, 1536 real val samples): eps=1e-4 is 400x below the</text>
<text x="471.0" y="729" font-size="13" text-anchor="middle" fill="#0055af" font-style="" font-weight="normal">median ||dz||^2 = 4.1e-2, so it floors 0.1% of samples; weights span 3884x and the</text>
<text x="471.0" y="747" font-size="13" text-anchor="middle" fill="#0055af" font-style="" font-weight="normal">top 1% of samples take 29% of the batch loss.</text>
<text x="471.0" y="765" font-size="13" text-anchor="middle" fill="#0055af" font-style="" font-weight="normal">Result (n=8): rho 0.448 -> 0.004, eff_dim 24.1 -> 7.5, d_action = 0 on 7 of 8 seeds.</text>
<text x="471.0" y="783" font-size="13" text-anchor="middle" fill="#0055af" font-style="" font-weight="normal">An implementation flaw, not a verdict on the idea.</text>
</svg>
