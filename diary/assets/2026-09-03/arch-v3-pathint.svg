<text x="476.0" y="667" font-size="13" text-anchor="middle" fill="#9a6700" font-style="" font-weight="bold">Proposed: TBT's reference frame, done causally</text>
<text x="476.0" y="685" font-size="13" text-anchor="middle" fill="#9a6700" font-style="" font-weight="normal">PiWM-refframe RECEIVED pose as a static side-channel and was a NULL (-0.063, p=0.169).</text>
<text x="476.0" y="703" font-size="13" text-anchor="middle" fill="#9a6700" font-style="" font-weight="normal">TBT requires the frame to be PATH-INTEGRATED by the movement -- that is the causal half</text>
<text x="476.0" y="721" font-size="13" text-anchor="middle" fill="#9a6700" font-style="" font-weight="normal">we omitted. Warm-started from the map fit on the dataset (95.2% of 1-step pose change).</text>
<text x="476.0" y="739" font-size="13" text-anchor="middle" fill="#9a6700" font-style="" font-weight="normal">Rollout uses the model's OWN head, so training and planning cannot drift apart.</text>
<text x="476.0" y="757" font-size="13" text-anchor="middle" fill="#9a6700" font-style="" font-weight="normal">MEASURED (n=8): rho 0.573, eff_dim 22.8, rel_mse 0.0094 -- indistinguishable from</text>
<text x="476.0" y="775" font-size="13" text-anchor="middle" fill="#9a6700" font-style="" font-weight="normal">the baseline -- with d_action 0.460, the largest of any arm that stayed healthy.</text>
<text x="476.0" y="793" font-size="13" text-anchor="middle" fill="#9a6700" font-style="" font-weight="normal">8/8 seeds pass the planning gate; CEM 0.260 (n=5) against the control's 0.357.</text>
