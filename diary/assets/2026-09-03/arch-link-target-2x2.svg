<text x="640.0" y="250" font-size="15" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">rho 0.509   eff_dim 26.1</text>
<text x="640.0" y="274" font-size="15" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">rel_mse 0.0082</text>
