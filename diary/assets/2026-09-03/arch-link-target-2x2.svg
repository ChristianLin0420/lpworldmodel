<text x="290.0" y="250" font-size="15" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">rho 0.448   eff_dim 24.1</text>
<text x="290.0" y="274" font-size="15" text-anchor="middle" fill="#1A1A1A" font-style="" font-weight="normal">rel_mse 0.0092</text>
