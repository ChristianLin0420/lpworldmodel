<text x="470" y="646" font-size="17" text-anchor="middle" fill="#3d3d3a" font-style="" font-weight="normal">Rows differ (link: p = 2.7e-06).  Columns do not (target_p: p = 0.21 / 0.80).</text>
<text x="470" y="676" font-size="14" text-anchor="middle" fill="#555" font-style="" font-weight="normal">A 1-D projection of a D=384 Laplace sample IS Gaussian (Diaconis-Freedman), and RDMReg only sees 1-D projections.</text>
