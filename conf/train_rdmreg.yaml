defaults:
  - _self_
  - env: pusht
  - encoder: vit_scratch
  - action_encoder: lewm_embedder
  - proprio_encoder: proprio   # instantiated but unused in the adaln path
  - decoder: vqvae             # not built (has_decoder: False)
  - predictor: ar_adaln
  - link: reprelu              # h(.) applied to encoder & predictor outputs
  - regularizer: rdmreg
  - override hydra/launcher: submitit_slurm

# base path to save model outputs. Checkpoints will be saved to ${ckpt_base_path}/outputs.
ckpt_base_path: ./ # put absolute path here

hydra:
  run:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    account: edgeai_tao-ptm_image-foundation-model-clip
    partition: polar4,polar3,polar,batch_block1,grizzly,batch_block2,batch_block3
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 16
    mem_gb: 200
    # NB: no gres type. These partitions expose GRES as "gpu:8" with no type
    # defined, so "gpu:h100:1" matches nothing and never schedules.
    gpus_per_node: 1
    # Every GPU partition here caps at 4h; anything larger is rejected at submit.
    timeout_min: 240
    signal_delay_s: 300     # USR1 this many seconds before the wall limit
    max_num_timeout: 20     # submitit auto-requeue budget
    setup: ["export DEBUGVAR=$(scontrol show hostnames $SLURM_JOB_NODELIST)",
            export MASTER_ADDR="$(scontrol show hostnames $SLURM_JOB_NODELIST | head -n 1)",
            "export MASTER_PORT=$(for port in $(shuf -i 30000-65500 -n 20); do if [[ $(netstat -tupln 2>&1 | grep $port | wc -l) -eq 0 ]] ; then echo $port; break; fi; done;)",]

training:
  seed: 0
  epochs: 100
  batch_size: 32
  save_every_x_epoch: 1
  save_every_x_min: 20      # mid-epoch wall-clock checkpointing (0 disables)
  # An epoch is ~30k batches (~2h), so epoch-only logging leaves every wandb panel
  # empty for hours, which looks exactly like a broken run. Three tiers, priced by
  # what each one actually costs on a node whose CPUs (not the GPU) are the
  # bottleneck: tier 1 is GPU reductions, tier 2 copies tensors to the host, tier 3
  # builds 2-D images. Any of them can be disabled with 0.
  log_every_x_batch: 50       # tier 1: scalars (losses, sparsity, Jaccard, opt, perf)
  diag_every_x_batch: 1000    # tier 2: wandb.Histogram distributions + self-similarity map
  heavy_every_x_batch: 2500  # tier 3: code / co-activation / gate / head-raster images
  video_every_x_batch: 5000   # real PushT rollout + rendered video (~1% of a window)
  video_episodes: 4            # episodes tiled side by side per clip
  video_max_frames: 50         # frames per episode
  diag_hist_max: 20000        # element cap per histogram payload
  diag_selfsim_n: 96          # rows in the J_S(z_a, z_b) self-similarity image
  diag_swd_proj: 256          # projections for the per-projection W2 breakdown (0 disables)
  diag_img_rows: 64           # rows in the code / gate / head-raster images
  diag_coact_units: 384       # unit cap for the co-activation matrix image
  reconstruct_every_x_batch: 500
  num_reconstruct_samples: 6
  encoder_lr: 5e-5
  decoder_lr: 3e-4      # unused (has_decoder: False)
  predictor_lr: 5e-5
  mup_lr: 5e-5              # muP shared base lr at base_width (used_lr = mup_lr*base_width/fan_in); sweep me
  mup_base_width: 384       # fixed global reference width (tuned base = embed_dim); NOT the swept code dim D
  mup_weight_decay: 0.01    # muP weight decay (AdamW, all 3 opts; held constant with width; effective decay = lr*wd, ~negligible at 2ep)
  action_encoder_lr: 5e-5
  # T4/V4 heads. Plain AdamW at a FIXED lr, deliberately NOT mup_param_groups: the heads'
  # fan-in is 3D, so muP would set their lr to mup_lr*base_width/(3D) and make it a
  # function of the swept width -- confounding T4 with the wave6/wave7 width x LR
  # factorial. Unused when value_w = policy_w = 0 (no head, no optimizer).
  value_lr: 3e-4

# Accelerate mixed_precision: "no" (fp32, upstream) | "bf16" | "fp16". Must be the
# same on every arm of a contrast; bf16 perturbs numerics, so a mixed comparison
# would confound precision with the intervention.
# Quoted: bare `no` is YAML 1.1 for False, which made the default value fail the
# precision assert, so any run that did not set PRECISION died at startup.
precision: "no"

img_size: 224
frameskip: 5
concat_dim: 0       # irrelevant for adaln
embed_dim: 384      # latent / projector output dim (DINO-WM-comparable)

normalize_action: True

# --- RDMReg (adaln) settings ---
action_conditioning: adaln
reg_weight: 100.0          # SWD is O(1) (unlike SIGReg's N-scaled stat) -> large weight; sweep per agg
detach_target: False       # no stop-grad
# Optional VICReg-style terms ON TOP of the always-on invariance (z_loss) + SWD (reg_loss).
# Both default 0 => OFF (identical to plain RDMReg). Setting lamb_var + lamb_cov (with an identity
# link, regularizer=none) gives the dense VICReg baseline (variance + covariance anti-collapse).
lamb_var: 0.0              # VICReg variance-floor weight (anti-collapse / balance)
lamb_cov: 0.0              # VICReg covariance (decorrelation) weight; var+cov = full VICReg dense baseline
var_space: u               # variance floor on pre-link "u" | post-link "z" | "both"
var_gamma: 1.0             # hinge target for the variance floor: relu(var_gamma - std_d).
# CALIBRATION (measured 2026-09-01 on trained pushT codes): healthy per-dim std(z) is ~0.45-0.49,
# so the VICReg-standard 1.0 sits ABOVE the operating point -- the hinge is then always maximally
# active (~0.51) and rescales the code rather than flooring it, which makes a +lamb_var arm a
# different model rather than a control. For an anti-collapse FLOOR use var_gamma=0.2 (~43% of
# healthy): exactly 0 in the healthy regime, active only once the code starts dying.
target_p: 1.0              # GN_p base shape for the target: 2 -> Gaussian, 1 -> Laplace
mu: 0.0                    # target-mean shift for the relu link: mu<0 -> sparser code (0 = doc default)
agg: btp                   # SWD aggregation: btp (pool) | b | bp | bt (see AGG_PATTERNS)

# --- Pi-WM interventions (all default to upstream behaviour) ---
kwta_k: null               # Step 2: k-WTA in the shared link; null => off. When set,
                           # train.py overrides mu to sigma*ln(2k/D) (density match).
gate_input: magnitude      # Step 3: ltv gate input, magnitude (upstream) | support
gate_norm: sigmoid         # Step 3: ltv gate normalization, sigmoid (upstream) | softmax
n_heads: 1                 # Step 4: union head count; 1 => upstream single head
head_entropy_coef: 0.0     # Step 4: entropy bonus on per-head usage; 0 => off

# action encoder (Embedder); emb_dim must equal embed_dim for adaln conditioning
action_emb_dim: 384
num_action_repeat: 1

# proprio encoder (unused in adaln)
proprio_emb_dim: 10
num_proprio_repeat: 1

num_hist: 3
num_pred: 1 # T6: this IS the option length K. 1 = one action row (5 env steps).
has_predictor: True
has_decoder: False

model:
  _target_: models.visual_world_model.VWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: True
  train_predictor: True
  train_decoder: False
  # T6: inside `model:` on purpose. plan.py rebuilds the model from train_cfg.model, so a
  # flag that changes ROLLOUT semantics has to live here or the overshoot arm would be
  # planned as a K-step option model -- which is not what it was trained as. The
  # training-only flags (decode_grad, contact_*) stay top-level: they touch the LOSS only.
  overshoot: ${overshoot}
  # T4/V4: inside `model:` for the same reason as overshoot, one step stronger.
  # plan.py:517 rebuilds the model from train_cfg.model with a FIXED kwarg list and no
  # knowledge of these heads, so a head that only exists when train.py passes an extra
  # kwarg would be absent at plan time -- and V4/V5 would then plan with a freshly
  # initialised MLP, which is exactly the retracted path_int result (diary s13.3).
  # Interpolated from the top-level keys below, so a run's saved hydra.yaml carries the
  # head's full geometry and plan.py can rebuild it from that file alone.
  value_w: ${value_w}
  value_mode: ${value_mode}
  value_tau: ${value_tau}
  value_gamma: ${value_gamma}
  value_hidden: ${value_hidden}
  value_ema: ${value_ema}
  value_p_future: ${value_p_future}
  policy_w: ${policy_w}
  act_dim_raw: ${act_dim_raw}

# --- ROUND 6 knobs. All inert at these defaults. -------------------------------------
# Every arm this round is a GRID, not a single point: six of the nine round-3/4/5
# proposals were single-shot on their strength knob, V1 had no knob at all (its epsilon
# was a literal 1e-4 in the source), and T4 would have died on its primary setting and
# was saved only by a variant. Training-only (they touch the LOSS, never the rollout),
# so they live top-level like decode_grad/contact_* rather than inside `model:`.
#
# PRE-REGISTERED DEATH CONDITION, all four terms, every grid point: err/rel_mse >= 0.5.
# An arm at or above it is not a world model and its CEM number is not evidence about the
# objective -- it is evidence that the objective broke prediction (T3's contact family
# sat at the floor and its own contrast was uninformative for exactly this reason).
#
# R6: loss on S_model = 1 - J_S(z_pred, target), added to z_loss. This is the one logged
# quantity that survives analysis/screen_objective.py -- raw Spearman -0.769 against CEM,
# partial (rho, rel_mse removed) -0.549, monotone over healthy predictors -- and
# soft_jaccard has never been optimised by anything in models/. Requires a rectified link
# (J_S is undefined on signed codes); VWorldModel raises otherwise.
#
# CALIBRATED 2026-09-04 on the trained baseline LpWM-ltv_pd384_bf16_s0 over 4 x 32 real
# pushT valid windows: S_model = 0.0866 (p90 0.135) against a z_loss MSE of 0.00578, so
# PARITY between the support term and the MSE is support_w = 0.0667. Suggested grid, one
# decade either side of parity: 0.0067 / 0.067 / 0.67. support_w = 1 is ~15x parity -- a
# legitimate top-of-grid point, not a default. rel_mse at that operating point is 0.0125,
# i.e. 40x under the death condition, and |z_pred| = 0.679 vs |target| = 0.681 is the
# scale the WATCH in _support_loss is about.
support_w: 0.0
# R2: rollout self-consistency, || P_K(z, a) - chain(P_1, z, a) ||^2, on actions drawn
# from the CEM PROPOSAL (planning/cem.py:99-106: randn*sigma + mu, mu=0, sigma=var_scale).
# Both sides are the model's own output, so no ground truth is needed and the loss can be
# evaluated at actions no demonstrator took -- which no training arm in ~60 has done.
consist_w: 0.0
consist_src: cem           # cem (the arm) | data (the matched control: same term,
                           # dataset actions, so the contrast IS the distribution)
consist_k: 5               # = CEM's goal_H / horizon (conf/plan_rdmreg.yaml:41,58)
consist_sigma: 1.0         # = CEM's var_scale (conf/plan_rdmreg.yaml:61)
# CALIBRATED on the same checkpoint and batch: consist_loss = 0.1107 for src=cem and
# 0.1915 for src=data (consist_rel 0.231 / 0.388), against z_loss MSE 0.00578 -- so the
# trained baseline's 5-step jump already disagrees with its own 5-step chain by ~19x its
# own 1-step error, and PARITY is consist_w = 0.052. Suggested grid: 0.005 / 0.05 / 0.5.
# The CONTROL is the larger term here: real action values disagree MORE than the
# planner's Gaussian ones. Worth having on record before the arm runs.
# R3: action-space sharpness-aware minimisation, min_theta max_{||da|| <= rho} L(z, a+da).
# rho is a per-action-row L2 radius in the NORMALISED action space, so it is directly
# comparable to var_scale = 1. The collapse mode is d_action -> 0 (a predictor that
# ignores the action inside the ball); sam_d_action is logged every epoch for that reason.
#
# CALIBRATED on the same checkpoint/batch. sam_sharpness = (L(a+delta) - L(a)) / L(a):
#   rho = 0.03 -> 0.061   rho = 0.1 -> 0.236   rho = 0.3 -> 0.997   rho = 1.0 -> 6.02
# so rho = 0.3 doubles the loss inside the ball and rho = 1 makes it 7x. Suggested grid:
# 0.03 / 0.1 / 0.3. The same measurement puts the baseline at sam_d_action = 0.345 and
# d_action/|z| = 0.509, which agrees with the archive's independent probe (0.354, 0.549,
# diary 2026-09-03 s12b) -- so this arm's falsifier is calibrated against a known number.
sam_rho: 0.0
# R4: V1's epsilon, made a knob. 1e-4 is the literal value PiWM-incr ran with -- 414x
# below the median increment 4.1e-2, giving ESS = 0.063, which is the whole explanation of
# its -0.383 [-0.497, -0.268] with 8/8 seeds dead. incr_clip caps the weight span
# (0 = off). Both are inert unless incr_norm is also true.
#
# CALIBRATED on the same checkpoint/batch (median increment MSE 0.0771, p05/p95
# 0.0089 / 0.272). ESS = mean(w)^2 / mean(w^2), sp = span = max/min:
#     eps      clip=0             clip=3             clip=10
#     1e-4     ESS 0.220 sp 312   ESS 0.524 sp 9     ESS 0.267 sp 100
#     1e-3     ESS 0.282 sp 209   ESS 0.537 sp 9     ESS 0.300 sp 100
#     4.1e-2   ESS 0.780 sp 14.3  ESS 0.785 sp 7.0   ESS 0.780 sp 14.3
#     1.0      ESS 0.995 sp 1.57  (the uniform baseline; the clip cannot bind)
# NB this measurement disagrees with the ESS = 0.063 / median-increment = 4.1e-2 quoted
# above: on LpWM-ltv s0's own valid windows the median increment is 0.0771 and ESS at
# eps=1e-4 is 0.220, not 0.063. Both are recorded rather than one silently replacing the
# other -- they are different populations (this one is a trained checkpoint's 4x32 valid
# windows), and 0.22 is still a 4.5x loss of effective batch, which is the point.
# So eps in {1e-4, 1e-3, 4.1e-2} x clip in {0, 3, 10} moves ESS over 0.22 -> 0.99, and
# the span bound max/min <= clip^2 is exact (9 and 100 above). V1 ran at the top-left
# cell of this table and had no way to leave it.
incr_eps: 1.0e-4
incr_clip: 0.0

debug: False

plan_settings:
  plan_cfg_path: null
  planner: ['gd', 'cem']
  goal_source: ['dset', 'random_state']
  goal_H: [5]
  alpha: [0.1, 1]

# Optional dedicated W&B project name; null => per-env default InfoJEPA_train_<env>.
mup: false
# muP INPUT-weight rule. models/mup.py documents (but never implemented) the carve-out that a
# finite->infinite map is an INPUT weight whose Adam LR is Theta(1) = base_lr, not
# base_lr*base_width/fan_in. Without it, at base_lr=5e-4: proprio_encoder.patch_embed (fan_in=4)
# trains at 4.8e-2 = 96x base_lr, action_encoder.patch_embed (10) at 38x, predictor.Ulag (16) at
# 24x. false => upstream behaviour, bit-identical.
mup_input_lr_fix: false

# TBT reference frame: bind the allocentric location signal (agent pose, obs["proprio"] =
# [x, y, vx, vy]) to the action embedding. The adaln path currently DROPS proprio at
# visual_world_model.py:174, so the loader materialises it every batch and the proprio
# encoder is optimised and checkpointed while receiving zero gradient. false => unchanged.
use_pose: false

# --- causal-objective knobs (V1-V3). All inert at these defaults. ---------------------
# The action is causally near-inert in the base objective: across 9 arms, changing a_t moves
# the PREDICTED latent by 0.02-0.1% of its own magnitude, and that displacement is the
# strongest predictor of CEM success measured so far (Spearman +0.81, p=0.0079).
incr_norm: false           # V1: per-sample increment normalisation of the prediction loss
act_info: 0.0              # V2: weight on InfoNCE over actions -> max I(a_t ; z_t+1 | z_t)
act_info_k: 4              # V2: in-batch action negatives
path_int: false            # V3: learned path integration of the location signal
path_int_w: 1.0            # V3: weight on the pose-prediction loss

# --- round-4 knobs (P1-P5). All inert at these defaults. ------------------------------
# The campaign varied the link, the target, the regulariser, the loss, sparsity, width, LR,
# the encoder, the conditioning and the head count -- and used predictor=ltv in 36 of 39
# arms. These vary the map g(z,a) itself, which is the axis nobody touched.
lie_sim: false             # P1b: predictor=lie uses similitudes instead of pure rotations
act_gain: null             # P3: beta making ||B a|| = beta * ||sum_k A_k z||; null = off
ctrb_w: 0.0                # P4: weight on -logdet of the H-step controllability Gramian
ctrb_h: 5                  # P4: horizon, = CEM's goal_H (conf/plan_lewm.yaml)
act_info_neg: perm         # P5: perm (V2, q = p(a)) | knn (q ~ p(a|z_t))

# LeVJEPA encoder knobs. Top-level so hydra can override them (the encoder yaml reads
# them via oc.select); same pattern as kwta_k. Both inert at these defaults.
token_drop: 0.0            # fraction of patch tokens dropped per step, train only
block_causal: false        # encode the clip jointly, causal across frames

# --- round-5 knobs (T1/T2). All inert at these defaults. -----------------------------
# T1/T2: attach a decoder as a TRAINING-TIME auxiliary head. Deliberately NOT has_decoder:
# plan.py:502-515 rebuilds a decoder for any run whose train_cfg has has_decoder=True and
# raises ValueError when the checkpoint holds a state_dict and env.decoder_path is null --
# which is every run this repo produces -- so has_decoder=True would make the arm
# untrainable-to-evaluate. aux_decoder builds/optimises/checkpoints the decoder exactly as
# has_decoder does (train.py init_models / init_optimizers / _keys_to_save) while leaving
# the plan-time model decoder-free, which is what CEM wants anyway (the objective is latent).
aux_decoder: false
decode_grad: false         # T1: reconstruction gradient reaches the encoder (drops the detach)
lamb_decode: 0.1           # weight on the pixel MSE; O(1e-1) vs z_loss O(2e-3), see specs
# ROUND 8 / S1. Pixel loss on the PREDICTOR's output for the NEXT, unseen frame.
# 0.0 => the term is not built and the path is bit-identical to upstream.
decode_pred_w: 0.0
# ROUND 8 / T2 rung 2. EMA teacher momentum. 0.0 => no teacher is built and the
# target path is bit-identical to upstream.
ema_m: 0.0

# T3: weight each transition by the visual change proprio does NOT explain. Images and
# proprio only -- states.pth never enters the loss. 0.0 => uniform (upstream, inert).
contact_gamma: 0.0
contact_shuffle: false     # ESS-matched control: same weight distribution, permuted
contact_eps: 1.0e-8
contact_pad: 1.6           # agent-disc radius padding (radius 15 sim units x pad)

# T6: K-step option model. num_pred (above) IS K, so the jump arm is num_pred=5 alone.
# overshoot is its MATCHED control: same num_pred=5 window (identical windows, identical
# batch composition), but the 1-step map is chained K times with per-row actions and every
# intermediate frame is supervised -- same horizon, compounding retained. Inert at false.
overshoot: false

# --- T4 / V4: hindsight goal-conditioned value + reactive policy. All inert here. ----
# T4: V(z, g) trained by TD with an in-sample expectile max. Any z_{t+k} in a window is a
# valid goal with label -k, so the labels are free and fully self-supervised -- latents
# and step counts only, no reward and no states.pth. This buys three things the round
# needs off one head: a leaf evaluator (V5), a decision-aware metric, and a greedy
# policy. Motivated by the leaf score, NOT by d_action: the latent distance CEM minimises
# is ranked against the TRUE task distance at only Spearman +0.398 (n=296).
value_w: 0.0               # weight on the value loss; 0.0 => the head is not built
value_mode: td             # td (T4) | mc (control a: MC regression) | geom (control b)
value_tau: 0.7             # expectile; 0.7 weights "faster than expected" 0.7 vs 0.3
value_gamma: 0.98          # 1/(1-gamma) = 50 model steps is the value floor
value_hidden: null         # head width; null => D
value_ema: 0.005           # Polyak rate for the target network
value_p_future: 0.5        # P(goal is an in-window future frame) vs cross-trajectory
# V4: a_t = pi(z_t, z_g) by behaviour cloning on the SAME latent, evaluated through the
# SAME PlanEvaluator with no search at all. Rides the T4 arm so the CEM number, the V5
# number and the V4 number come off bit-identical encoder/predictor weights.
policy_w: 0.0              # weight on the BC loss; 0.0 => the head is not built
# RAW action width (2 * frameskip = 10 on pushT), NOT the 384-d action embedding. Must be
# set whenever policy_w > 0: train.py asserts it against the dataset's own action_dim, so
# a wrong value is a startup error rather than a head that is unloadable at plan time.
act_dim_raw: null
                # Maximal Update Parametrization (width transfer): per-param lr=mup_lr/fan_in + muP init. See models/mup.py.
wandb_project: null
burst_tau: 0.5             # Step 4 burst readout threshold on 1 - J_S (provisional)
