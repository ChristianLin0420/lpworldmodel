defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

# Planning eval for RDMReg (adaln) checkpoints. Env-agnostic: env / encoder
# (cls or patch) / link h(.) are all loaded from the run's saved hydra.yaml and
# its checkpoint, so this one config evals any RDMReg run. Verified correct for
# both CLS (num_patches=1) and patch (num_patches=grid**2): the objective and
# evaluator reduce over all trailing dims, the link is in the loaded encoder/
# predictor + the model-level link, and plan-time images are resized to img_size
# (224) so the patch count matches training (predictor spatial_pos). The objective
# is visual-only (adaln drops proprio -> alpha is inert).

hydra:
  run:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
  sweep:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 16
    mem_gb: 256
    gres: "gpu:h100:1"
    qos: "explore"
    timeout_min: 720
    setup: ["export DEBUGVAR=$(scontrol show hostnames $SLURM_JOB_NODELIST)",
            export MASTER_ADDR="$(scontrol show hostnames $SLURM_JOB_NODELIST | head -n 1)",
            "export MASTER_PORT=$(for port in $(shuf -i 30000-65500 -n 20); do if [[ $(netstat -tupln 2>&1 | grep $port | wc -l) -eq 0 ]] ; then echo $port; break; fi; done;)",]

# model to load for planning
ckpt_base_path: ./checkpoints  # loaded from ${ckpt_base_path}/outputs/<model_name>
model_name: null
model_epoch: latest

seed: 99
n_evals: 50
goal_source: 'dset'   # standard DINO-WM protocol: goal from a real traj goal_H steps ahead (reachable, in-distribution); matches plan_pusht/plan_lewm. random_state samples arbitrary (often unreachable) env states -> unfairly hard, not comparable to the dset baselines
goal_H: 5
n_plot_samples: 10

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 0            # visual-only (adaln has no proprio latent); inert for adaln
  base: 2
  mode: last

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 10  # cap MPC re-planning iters (null = unbounded = too slow)
  n_taken_actions: 5
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 5
    topk: 30
    num_samples: 300
    var_scale: 1
    opt_steps: 10
    eval_every: 1
  name: mpc_cem
