defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

# Planning eval for LeWM-style (adaln) checkpoints. Env/dataset/encoder are
# loaded from the run's saved hydra.yaml, so this config is env-agnostic — just
# point model_name at the run dir under ${ckpt_base_path}/outputs/.
# The objective is visual-only (adaln drops proprio, so alpha is inert here).

hydra:
  run:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
  sweep:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 16
    mem_gb: 256
    gres: "gpu:h100:1"
    qos: "explore"
    timeout_min: 720
    setup: ["export DEBUGVAR=$(scontrol show hostnames $SLURM_JOB_NODELIST)",
            export MASTER_ADDR="$(scontrol show hostnames $SLURM_JOB_NODELIST | head -n 1)",
            "export MASTER_PORT=$(for port in $(shuf -i 30000-65500 -n 20); do if [[ $(netstat -tupln 2>&1 | grep $port | wc -l) -eq 0 ]] ; then echo $port; break; fi; done;)",]

# model to load for planning
ckpt_base_path: ./checkpoints  # put absolute path here. Checkpoints loaded from ${ckpt_base_path}/outputs
model_name: null
model_epoch: latest
# Plan-time consensus (planning/ensemble.py): list M run dirs (optionally "<run>@<epoch>")
# to vote on every CEM candidate; model_name then only labels the output dir. null => the
# ordinary single-model eval, unchanged. Pair with objective._target_=create_vote_objective_fn.
ensemble_members: null

seed: 99
n_evals: 50
goal_source: 'dset'
goal_H: 5
n_plot_samples: 10

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 0            # visual-only (adaln has no proprio latent); inert for adaln
  base: 2
  mode: last

# ---- V3 (PiWM-2lvl): two-level contact planner ------------------------------------
# Identical to conf/plan_lewm.yaml except for the sub_planner. BUDGET-MATCHED to flat
# CEM by construction: n_subgoals * n_ctrl == 300 == conf/plan_lewm.yaml num_samples,
# same opt_steps (30), same horizon, same objective, same max_iter, same checkpoints
# and (seed=block) the same episodes. topk_ctrl == flat CEM's topk. The only thing
# that differs is the PROPOSAL: one held approach command x a short free push, with a
# subgoal scored by the best push it admits.
#
# The inert default is NOT LOADING THIS FILE: conf/plan_lewm.yaml is untouched, so
# every existing arm stays bit-identical.
planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 10
  n_taken_actions: 5        # overwritten to goal_H at plan.py:202
  sub_planner:
    target: planning.two_level.TwoLevelPlanner  # mpc.py:44 copies target -> _target_
    horizon: 5              # overwritten to goal_H at plan.py:201
    k_reach: 3              # approach steps; the push gets H-k = 2
    n_subgoals: 15          # S
    n_ctrl: 20              # C;  S*C = 300 = flat CEM num_samples
    topk_sub: 5
    topk_ctrl: 30           # = flat CEM topk
    var_scale: 1
    opt_steps: 30
    eval_every: 1
  name: mpc_two_level
