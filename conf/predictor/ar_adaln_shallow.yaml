_target_: models.infojepa_modules.ARPredictor
# P1 rung of the predictor-complexity ladder (docs/sparsity_linear_dynamics.md): a SHALLOW
# AdaLN transformer (depth 2) -- mildly nonlinear. input_dim/hidden_dim/output_dim/
# num_frames/num_patches injected by train.py (all == encoder emb_dim). head=mlp (dense
# pred_proj); the VWorldModel link (relu for the RDMReg demo) is applied afterward.
depth: 2
heads: 16
mlp_dim: 2048
dim_head: 64
dropout: 0.1
emb_dropout: 0.0
pred_proj_hidden: 2048
